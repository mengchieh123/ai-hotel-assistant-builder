name: Deploy to Render (CI/CD)

# 觸發條件
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允許手動觸發

env:
  # 使用最新的 LTS 版本
  NODE_VERSION: '20'
  # RENDER_SERVICE_ID 和 RENDER_API_KEY 必須在 GitHub Secrets 中設置
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  # 測試與構建驗證階段
  test:
    name: Test and Build Verification
    runs-on: ubuntu-latest
    
    steps:
      # 1. 標準的程式碼檢出
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 設置 Node.js 環境
      - name: Setup Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      # 3. 安裝依賴
      - name: Install dependencies
        run: |
          echo "📦 安裝依賴..."
          npm install
          echo "✅ 依賴安裝完成"

      # 4. 運行測試（如果存在）
      - name: Run tests (if present)
        run: |
          echo "🧪 運行測試..."
          npm test 2>/dev/null || echo "ℹ️ 沒有測試腳本 (npm test)，跳過測試"

      # 5. 健康檢查 (驗證 server.js 啟動 - 假設運行在 PORT 10000)
      - name: Check server startup
        timeout-minutes: 3
        run: |
          echo "🚀 測試服務器啟動..."
          npm start &
          SERVER_PID=$!
          echo "等待服務器啟動..."
          sleep 8
          
          if ! ps -p $SERVER_PID > /dev/null; then
            echo "❌ 服務器進程已退出，啟動失敗"
            exit 1
          fi
          
          echo "✅ 服務器進程運行中，PID: $SERVER_PID"
          
          # 檢查健康檢查端點 (假定 /health 跑在 10000)
          if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:10000/health | grep -q "200"; then
              echo "✅ 健康檢查通過 (端口 10000)"
              kill $SERVER_PID 2>/dev/null || true
              exit 0
          else
              echo "❌ 健康檢查失敗：服務未在端口 10000 響應"
              kill $SERVER_PID 2>/dev/null || true
              exit 1
          fi

      # 6. 構建驗證
      - name: Build verification
        run: |
          echo "🔨 構建驗證..."
          npm run build --if-present || echo "ℹ️ 沒有構建腳本，跳過構建"
          echo "✅ 構建檢查完成"

  # 部署階段
  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
    runs-on: ubuntu-latest
    
    steps:
      # 1. 檢出程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. **終極診斷與修正：確保 Key 和 ID 絕對純淨，並強制構造 Header**
      - name: Trigger Render Deploy (Final Diagnosis)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🚀 開始部署到 Render..."
          
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ 錯誤：RENDER_API_KEY 或 RENDER_SERVICE_ID 未設置"
            exit 1
          fi
          
          # 步驟 A: 嚴格清理 Service ID
          CLEAN_SERVICE_ID=$(echo "$RENDER_SERVICE_ID" | tr -d '[:space:]')
          
          # 步驟 B: 嚴格清理 API Key 並寫入臨時檔案
          # 使用 tr -d 清理，然後寫入臨時檔案
          echo -n "$RENDER_API_KEY" | tr -d '[:space:]' > /tmp/api_key_clean.txt
          
          # 步驟 C: 構造完整的 Authorization Header 檔案
          # 將 'Authorization: Bearer <KEY>' 寫入一個檔案，確保格式無誤
          echo -n "Authorization: Bearer " > /tmp/auth_header.txt
          cat /tmp/api_key_clean.txt >> /tmp/auth_header.txt
          
          echo "Debug: Clean Service ID: $CLEAN_SERVICE_ID"
          
          # 步驟 D: 執行 CURL
          # -H @/tmp/auth_header.txt : 從檔案讀取整個 Header (最強制的方式)
          # -d '...' : 直接傳輸 JSON 負載
          DEPLOY_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/$CLEAN_SERVICE_ID/deploys" \
            -H @/tmp/auth_header.txt \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}')
          
          rm -f /tmp/api_key_clean.txt /tmp/auth_header.txt # 清理臨時檔案
          
          HTTP_CODE=$(echo "$DEPLOY_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$DEPLOY_RESPONSE" | head -n -1)
          
          echo "Render Response Body: $RESPONSE_BODY"
          
          if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 部署觸發失敗，HTTP 狀態碼: $HTTP_CODE"
            echo "響應內容: $RESPONSE_BODY"
            exit 1
          fi
          
          echo "✅ 部署觸發成功，HTTP 狀態碼: $HTTP_CODE"
          
          DEPLOY_ID=$(echo "$RESPONSE_BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ -n "$DEPLOY_ID" ]; then
            echo "部署 ID: $DEPLOY_ID"
            echo "DEPLOY_ID=$DEPLOY_ID" >> $GITHUB_ENV
          fi

      # 3. 監控部署狀態
      - name: Monitor Deployment Status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          DEPLOY_ID=${{ env.DEPLOY_ID }}
          
          if [ -z "$DEPLOY_ID" ]; then
            echo "⚠️ 未獲取到部署 ID，跳過狀態監控。"
            exit 0
          fi
          
          echo "⏳ 開始監控部署狀態..."
          
          for i in {1..30}; do
            sleep 10
            
            # 在這裡，我們暫時使用最簡單的方式讀取 Key，因為 Key 已經被驗證為有效且純淨
            STATUS_RESPONSE=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
            
            STATUS=$(echo "$STATUS_RESPONSE" | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            
            if [ -z "$STATUS" ]; then
              echo "檢查 ($i/30): 無法獲取狀態"
              continue
            fi
            
            echo "檢查 ($i/30): 狀態 = $STATUS"
            
            if [ "$STATUS" = "live" ]; then
              echo "🎉 部署成功！服務已上線"
              break
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "post_deploy_failed" ]; then
              echo "❌ 部署失敗: $STATUS"
              exit 1
            fi
          done
          
          if [ "$STATUS" != "live" ]; then
            echo "⚠️ 部署監控超時，最終狀態: $STATUS"
            exit 1
          fi

      # 4. 獲取服務 URL
      - name: Get service URL
        id: get_url
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "🔗 獲取服務 URL..."
          
          SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")
          
          SERVICE_URL=$(echo "$SERVICE_INFO" | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ -n "$SERVICE_URL" ]; then
            echo "服務 URL: $SERVICE_URL"
            echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          else
            DEFAULT_URL="https://$RENDER_SERVICE_ID.onrender.com"
            echo "⚠️ 無法從響應中提取服務 URL，使用默認格式: $DEFAULT_URL"
            echo "service_url=$DEFAULT_URL" >> $GITHUB_OUTPUT
          fi

  # 通知階段
  notify:
    name: Send Notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      statuses: write
      
    steps:
      - name: Create Deployment Summary
        uses: actions/github-script@v6
        with:
          script: |
            const deployResult = '${{ needs.deploy.result }}';
            const statusState = deployResult === 'success' ? 'success' : 'failure';
            const emoji = deployResult === 'success' ? '🎉' : '❌';
            // 由於 outputs 可能不存在，這裡使用一個預設 URL
            const serviceUrl = '${{ needs.deploy.outputs.service_url }}' || 'https://ai-hotel-assistant.onrender.com';

            const summary = `
            # ${emoji} 部署報告 - AI Hotel Assistant
            
            ## 基本資訊
            - **狀態**: **${deployResult.toUpperCase()}**
            - **觸發分支**: ${context.ref}
            - **觸發提交**: [\`${context.sha.substring(0, 7)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})
            - **應用 URL**: [${serviceUrl}](${serviceUrl})
            
            ## 執行狀態
            - **測試階段**: **${{ needs.test.result }}**
            - **部署階段**: **${deployResult}**
            
            ## 相關連結
            - [GitHub Actions 運行詳情](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - [Render Dashboard](https://dashboard.render.com)
            `;
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: statusState,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: statusState === 'success' ? 'Render 部署成功' : 'Render 部署失敗',
              context: 'Render Deployment Status'
            });
            
            core.summary.addRaw(summary).write();
            
            if (context.payload.pull_request) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## ${emoji} 部署完成\n\n${summary}`
              });
            }
