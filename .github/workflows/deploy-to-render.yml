name: Deploy to Render

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 允許手動觸發

env:
  NODE_VERSION: '18'
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  # 測試階段
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: |
          echo "🔍 運行測試..."
          npm test 2>/dev/null || echo "⚠️  沒有測試腳本，跳過測試"
      
      - name: Check server startup
        timeout-minutes: 2
        run: |
          echo "🚀 測試服務器啟動..."
          # 啟動服務器在後台
          npm start &
          SERVER_PID=$!
          
          # 等待服務器啟動
          sleep 5
          
          # 檢查服務器是否運行
          if ps -p $SERVER_PID > /dev/null; then
            echo "✅ 服務器啟動成功"
            # 測試健康檢查端點
            curl -f http://localhost:3000/health || curl -f http://localhost:10000/health
            echo "✅ 健康檢查通過"
            # 停止服務器
            kill $SERVER_PID
          else
            echo "❌ 服務器啟動失敗"
            exit 1
          fi
      
      - name: Build verification
        run: |
          echo "📦 構建驗證..."
          npm run build --if-present || echo "⚠️  沒有構建腳本"
          echo "✅ 構建檢查完成"

  # 部署階段
  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --only=production
      
      - name: Deploy to Render via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🚀 開始部署到 Render..."
          
          # 檢查必要的密鑰
          if [ -z "$RENDER_API_KEY" ]; then
            echo "❌ RENDER_API_KEY 未設置"
            echo "請在 GitHub Secrets 中設置 RENDER_API_KEY"
            exit 1
          fi
          
          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ RENDER_SERVICE_ID 未設置"
            echo "請在 GitHub Secrets 中設置 RENDER_SERVICE_ID"
            exit 1
          fi
          
          echo "使用服務 ID: $RENDER_SERVICE_ID"
          
          # 方法1: 使用 Render API 觸發部署
          echo "觸發 Render 部署..."
          DEPLOY_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}')
          
          if [ $? -eq 0 ]; then
            echo "✅ 部署觸發成功"
            echo "響應: $DEPLOY_RESPONSE"
            
            # 提取部署 ID
            DEPLOY_ID=$(echo $DEPLOY_RESPONSE | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            if [ -n "$DEPLOY_ID" ]; then
              echo "部署 ID: $DEPLOY_ID"
              
              # 等待部署完成
              echo "⏳ 等待部署完成..."
              for i in {1..30}; do
                sleep 10
                STATUS=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
                  "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | \
                  grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
                
                echo "檢查狀態 ($i/30): $STATUS"
                
                case $STATUS in
                  "live")
                    echo "🎉 部署成功！服務已上線"
                    break
                    ;;
                  "failed"|"canceled")
                    echo "❌ 部署失敗: $STATUS"
                    exit 1
                    ;;
                esac
              done
            fi
          else
            echo "❌ 部署觸發失敗"
            exit 1
          fi
      
      - name: Get service URL
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🔗 獲取服務 URL..."
          SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")
          
          SERVICE_URL=$(echo $SERVICE_INFO | grep -o '"serviceDetails":{[^}]*"url":"[^"]*"' | head -1 | cut -d'"' -f6)
          
          if [ -n "$SERVICE_URL" ]; then
            echo "服務 URL: $SERVICE_URL"
            echo "::set-output name=service_url::$SERVICE_URL"
          else
            echo "⚠️  無法獲取服務 URL"
          fi

  # 通知階段
  notify:
    name: Send Notification
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "🎉 部署成功完成！"
            echo "應用已部署到 Render"
            echo "服務 ID: ${{ env.RENDER_SERVICE_ID }}"
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "❌ 部署失敗"
            echo "請檢查 GitHub Actions 日誌"
          else
            echo "⚠️  部署狀態未知"
          fi
      
      - name: Create Deployment Summary
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const summary = `
            # 部署報告 - AI Hotel Assistant
            
            ## 基本信息
            - **觸發分支**: ${context.ref}
            - **觸發提交**: ${context.sha.substring(0, 7)}
            - **觸發時間**: ${new Date().toISOString()}
            
            ## 執行狀態
            - **測試階段**: ${{ needs.test.result }}
            - **部署階段**: ${{ needs.deploy.result }}
            
            ## 下一步
            1. 訪問部署的服務
            2. 檢查日誌和監控
            3. 如有問題，查看詳細日誌
            
            ## 相關鏈接
            - [GitHub Actions 運行](${context.serverUrl}/${context.repo.ownerName}/${context.repo.repoName}/actions/runs/${context.runId})
            - [Render Dashboard](https://dashboard.render.com)
            `;
            
            // 創建部署狀態
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ needs.deploy.result }}' === 'success' ? 'success' : 'failure',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: '${{ needs.deploy.result }}' === 'success' ? '部署成功' : '部署失敗',
              context: 'Render Deployment'
            });
            
            // 添加為檢查運行摘要
            core.summary.addRaw(summary).write();
