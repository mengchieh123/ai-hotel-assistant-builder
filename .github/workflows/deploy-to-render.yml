name: Deploy to Render (CI/CD)

# 觸發條件
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: 

env:
  # 使用最新的 LTS 版本
  NODE_VERSION: '20' 
  # RENDER_SERVICE_ID 和 RENDER_API_KEY 必須在 GitHub Secrets 中設置
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  
jobs:
  # 測試與構建驗證階段
  test:
    name: Test and Build Verification
    runs-on: ubuntu-latest
    
    # 設置環境變數，定義專案路徑
    env:
      PROJECT_DIR: ${{ github.event.repository.name }} 
      
    steps:
      # 🎯 關鍵修正：使用 Bash 手動 Git Clone，解決 Git 錯誤 128
      - name: Manual Git Clone for Diagnosis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          echo "🔍 嘗試手動 Git Clone 以診斷錯誤 128..."
          
          # 設定認證並執行 Clone (使用 GITHUB_TOKEN)
          AUTH_URL="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"
          git clone --depth 1 "$AUTH_URL" $PROJECT_DIR
          
          if [ $? -ne 0 ]; then
             echo "❌ 手動 Git Clone 失敗。請檢查上方的詳細錯誤訊息。"
             exit 1 
          fi
          
          # 切換到專案目錄
          cd $PROJECT_DIR
          
          # 處理 LFS (如果存在)
          if [ -d ".git/lfs" ] || grep -q 'filter=lfs' .gitattributes; then
              echo "LFS 偵測到，手動拉取 LFS 文件..."
              git lfs install
              git lfs pull
          fi
          
          echo "✅ Clone 成功，繼續後續步驟..."
          
      # 設置 Node.js
      - name: Setup Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json # 確保緩存路徑正確
      
      # 安裝依賴
      - name: Install dependencies (npm ci)
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm ci
      
      # 運行測試
      - name: Run tests (if present)
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "🔍 運行測試..."
          npm test 2>/dev/null || echo "⚠️  沒有測試腳本 (npm test)，跳過測試"
      
      # 檢查服務器啟動
      - name: Check server startup
        timeout-minutes: 2
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "🚀 測試服務器啟動..."
          npm start &
          SERVER_PID=$!
          sleep 5 
          
          if ps -p $SERVER_PID > /dev/null; then
            echo "✅ 服務器啟動成功，PID: $SERVER_PID"
            
            # 測試健康檢查端點 (嘗試 3000 或 8080)
            if curl -f http://localhost:3000/health || curl -f http://localhost:8080/health; then
                echo "✅ 健康檢查通過"
            else
                echo "❌ 健康檢查失敗 (服務未響應 /health)"
                kill $SERVER_PID
                exit 1
            fi
            
            kill $SERVER_PID
          else
            echo "❌ 服務器啟動失敗 (Process not found)"
            exit 1
          fi
      
      # 構建驗證
      - name: Build verification
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "📦 構建驗證..."
          npm run build --if-present || echo "⚠️  沒有構建腳本 (npm run build)，檢查完成"
          echo "✅ 構建檢查完成"

  # 部署階段
  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    
    # 設置環境變數，定義專案路徑
    env:
      PROJECT_DIR: ${{ github.event.repository.name }} 
    
    # 設置輸出，供後續通知 Job 使用
    outputs:
      service_url: ${{ steps.get_url.outputs.service_url }}

    steps:
      # 🎯 關鍵修正：手動 Git Clone，解決 Git 錯誤 128
      - name: Manual Git Clone for Deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          echo "🔍 嘗試手動 Git Clone..."
          AUTH_URL="https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}"
          git clone --depth 1 "$AUTH_URL" $PROJECT_DIR
          
          if [ $? -ne 0 ]; then
             echo "❌ 手動 Git Clone 失敗。"
             exit 1 
          fi
          cd $PROJECT_DIR
          
          if [ -d ".git/lfs" ] || grep -q 'filter=lfs' .gitattributes; then
              echo "LFS 偵測到，手動拉取 LFS 文件..."
              git lfs install
              git lfs pull
          fi
          echo "✅ Clone 成功，繼續後續步驟..."
      
      - name: Setup Node.js v${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json
      
      - name: Install production dependencies only
        run: |
          cd ${{ env.PROJECT_DIR }}
          npm ci --only=production
      
      # Render 部署 API 邏輯
      - name: Deploy to Render via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          cd ${{ env.PROJECT_DIR }}
          echo "🚀 開始部署到 Render..."
          
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "❌ 錯誤：RENDER API 密鑰或服務 ID 未設置。"
            exit 1
          fi
          
          echo "使用服務 ID: $RENDER_SERVICE_ID"
          
          DEPLOY_RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": true}')
          
          if [ $? -ne 0 ]; then
             echo "❌ 部署觸發失敗：CURL 錯誤。"
             echo "響應: $DEPLOY_RESPONSE"
             exit 1
          fi
          
          DEPLOY_ID=$(echo $DEPLOY_RESPONSE | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
          
          if [ -z "$DEPLOY_ID" ]; then
             echo "❌ 部署觸發失敗：無法從響應中提取 DEPLOY_ID。"
             echo "響應: $DEPLOY_RESPONSE"
             exit 1
          fi
          
          echo "✅ 部署觸發成功，部署 ID: $DEPLOY_ID"
          
          echo "⏳ 等待部署完成 (最多 5 分鐘)..."
          STATUS="pending"
          for i in {1..30}; do
            sleep 10
            STATUS_CHECK=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID")
            
            STATUS=$(echo $STATUS_CHECK | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            
            echo "檢查狀態 ($i/30): $STATUS"
            
            case $STATUS in
              "live")
                echo "🎉 部署成功！服務已上線"
                break
                ;;
              "failed"|"canceled"|"post_deploy_failed")
                echo "❌ 部署失敗或取消: $STATUS"
                exit 1
                ;;
              "in_progress"|"build_in_progress"|"pre_deploy")
                continue
                ;;
              *)
                if [ -z "$STATUS" ]; then
                    echo "⚠️  無法獲取狀態，繼續等待..."
                fi
                continue 
            esac
          done
          
          if [ "$STATUS" != "live" ]; then
              echo "❌ 部署超時 (Timeout)，狀態停留在 $STATUS"
              exit 1
          fi
      
      - name: Get service URL
        id: get_url 
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "🔗 獲取服務 URL..."
          SERVICE_INFO=$(curl -s -H "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")
          
          SERVICE_URL=$(echo $SERVICE_INFO | grep -o '"serviceDetails":{[^}]*"url":"[^"]*"' | head -1 | cut -d'"' -f6)
          
          if [ -n "$SERVICE_URL" ]; then
            echo "服務 URL: $SERVICE_URL"
            echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
          else
            echo "⚠️  無法獲取服務 URL。響應截斷或格式錯誤。"
          fi

  # 通知階段
  notify:
    name: Send Notification
    needs: deploy
    if: always() 
    runs-on: ubuntu-latest
    
    permissions:
      contents: read 
      statuses: write 
      
    steps:
      - name: Create Deployment Summary
        uses: actions/github-script@v6
        with:
          script: |
            const deployResult = '${{ needs.deploy.result }}';
            const statusState = deployResult === 'success' ? 'success' : 'failure';
            const emoji = deployResult === 'success' ? '🎉' : '❌';

            const serviceUrl = '${{ needs.deploy.outputs.service_url }}' || 'N/A';

            const summary = `
            # ${emoji} 部署報告 - AI Chatbot
            
            ## 基本資訊
            - **狀態**: **${deployResult.toUpperCase()}**
            - **觸發分支**: ${context.ref}
            - **觸發提交**: [\`${context.sha.substring(0, 7)}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})
            - **應用 URL**: ${serviceUrl !== 'N/A' ? `[點擊訪問](${serviceUrl})` : serviceUrl}
            
            ## 執行狀態
            - **測試階段**: **${{ needs.test.result }}**
            - **部署階段**: **${deployResult}**
            `;
            
            github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: statusState,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: statusState === 'success' ? 'Render 部署成功' : 'Render 部署失敗',
              context: 'Render Deployment Status'
            });
            
            core.summary.addRaw(summary).write();
