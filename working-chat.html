<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯店AI訂房助理</title>
    <style>
        /* CSS 樣式保持不變，因為它們看起來非常專業且美觀 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container { 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 90vh;
            position: relative;
        }
        .header { 
            background: linear-gradient(135deg, #2c3e50, #34495e); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            position: relative;
        }
        .header-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }
        .chat-messages { 
            flex: 1;
            overflow-y: auto; 
            padding: 20px; 
            background: #f8f9fa; 
            display: flex;
            flex-direction: column;
        }
        .message { 
            margin-bottom: 15px; 
            display: flex; 
            align-items: flex-start; 
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message { 
            justify-content: flex-end; 
        }
        .bot-message { 
            justify-content: flex-start; 
        }
        .message-bubble { 
            max-width: 70%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            line-height: 1.4; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .user-message .message-bubble { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
        }
        .bot-message .message-bubble { 
            background: white; 
            color: #333; 
            border: 1px solid #e0e0e0; 
        }
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            transition: all 0.3s;
        }
        .quick-reply-btn {
            padding: 10px 15px;
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .quick-reply-btn:hover {
            background: #e8f0fe;
            border-color: #1a73e8;
            transform: translateY(-1px);
        }
        .input-area { 
            padding: 20px; 
            background: white; 
            border-top: 1px solid #e0e0e0; 
            display: flex; 
            gap: 10px; 
        }
        .message-input { 
            flex: 1; 
            padding: 12px 16px; 
            border: 2px solid #e0e0e0; 
            border-radius: 25px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.3s;
        }
        .message-input:focus {
            border-color: #007bff;
        }
        .send-button { 
            padding: 12px 24px; 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            transition: transform 0.2s;
        }
        .send-button:hover {
            transform: translateY(-2px);
        }
        .send-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        .typing { 
            padding: 10px; 
            color: #666; 
            font-style: italic; 
        }
        .typing-dots {
            display: inline-block;
        }
        .typing-dots::after {
            content: '...';
            animation: typing 1.5s infinite;
        }
        @keyframes typing {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .session-info { 
            font-size: 12px; 
            opacity: 0.7; 
            margin-top: 5px; 
        }
        .service-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #007bff;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .service-card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .service-card p {
            margin-bottom: 15px;
            color: #555;
        }
        .service-card button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .service-card button:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }
        .room-types {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .room-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
            cursor: pointer;
        }
        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .room-card h4 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .room-features {
            list-style: none;
            margin: 10px 0;
        }
        .room-features li {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .room-price {
            font-weight: bold;
            color: #007bff;
            font-size: 18px;
            margin: 10px 0;
        }
        .welcome-message {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
            margin: 10px 0;
        }
        .reset-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
            display: none;
        }
        .reset-confirm.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show {
            display: block;
        }
        .error-message {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
        }
        /* 修正：為 Session Info 調整顏色，讓它更突出 */
        .session-info {
            font-size: 12px;
            opacity: 1; /* 提高可見度 */
            margin-top: 5px;
            color: #ccc; /* 淺灰色 */
        }
    </style>
</head>
<body>
    <div class="overlay" id="overlay"></div>
    <div class="reset-confirm" id="resetConfirm">
        <h3>🔄 開始新對話</h3>
        <p>確定要清除當前對話記錄並開始新的對話嗎？</p>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
            <button class="control-btn" style="background: #dc3545;" onclick="confirmReset()">確定重置</button>
            <button class="control-btn" style="background: #6c757d;" onclick="cancelReset()">取消</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="header">
            <div class="header-controls">
                <button class="control-btn" onclick="showResetConfirm()">🔄 新對話</button>
                <button class="control-btn" onclick="exportChat()">💾 匯出記錄</button>
            </div>
            <h1>🏨 台北ＸＸ酒店 AI訂房助理</h1>
            <div id="status" style="color: white; font-weight: bold;">🟢 服務連線中</div>
            <div class="session-info">會話ID: <span id="sessionId"></span></div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            </div>
        
        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" data-service="訂房服務">🏨 訂房服務</button>
            <button class="quick-reply-btn" data-service="接送機服務">🚗 接送機服務</button>
            <button class="quick-reply-btn" data-service="價格查詢">💰 價格查詢</button>
            <button class="quick-reply-btn" data-service="景點推薦">🎯 景點推薦</button>
            <button class="quick-reply-btn" data-service="餐廳推薦">🍽️ 餐廳推薦</button>
        </div>
        
        <div class="input-area">
            <input type="text" class="message-input" id="messageInput" placeholder="輸入您的訊息..." autocomplete="off">
            <button class="send-button" id="sendButton">傳送</button>
        </div>
    </div>

    <script>
        // === 核心變數定義 ===
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sessionIdDisplay = document.getElementById('sessionId');
        const quickReplies = document.getElementById('quickReplies');
        const resetConfirm = document.getElementById('resetConfirm');
        const overlay = document.getElementById('overlay');
        const statusDisplay = document.getElementById('status');

        // 🚨 修正後的後端 API 地址
        const API_BASE_URL = 'https://ai-hotel-assistant-builder-production.up.railway.app';
        const API_CHAT_ENDPOINT = `${API_BASE_URL}/api/chat`; 

        // 智能 Session 管理
        let sessionId = generateSessionId();
        // 修正：chatHistory 儲存為 {role: 'user'/'model', text: '...'} 格式
        let chatHistory = []; 
        let lastActivityTime = Date.now();
        const SESSION_TIMEOUT = 30 * 60 * 1000; // 30分鐘超時

        // === 初始化函數 ===
        function initializeChat() {
            // 恢復或創建會話
            const savedSession = localStorage.getItem('hotelChatSession');
            if (savedSession) {
                try {
                    const sessionData = JSON.parse(savedSession);
                    if (Date.now() - sessionData.lastActivity < SESSION_TIMEOUT) {
                        sessionId = sessionData.sessionId;
                        // 修正：確保讀取的歷史記錄格式正確
                        chatHistory = sessionData.chatHistory.filter(
                            msg => msg.role && msg.text
                        ) || [];
                        restoreChatHistory();
                    } else {
                        // 超時：創建新會話並給出提示
                        createNewSession(true); 
                    }
                } catch (e) {
                    console.error("Error parsing stored session, creating new one.", e);
                    createNewSession();
                }
            } else {
                createNewSession();
            }
            
            sessionIdDisplay.textContent = sessionId;
            setupEventListeners();
            startSessionMonitor();
            checkBackendStatus(); 
        }

        /**
         * 創建新會話
         * @param {boolean} isTimeout - 是否因超時而創建
         */
        function createNewSession(isTimeout = false) {
            sessionId = generateSessionId();
            chatHistory = [];
            chatMessages.innerHTML = ''; // 清空顯示
            if (isTimeout) {
                showSessionTimeoutWarning();
            } else {
                showWelcomeMessage();
            }
            saveSession();
        }

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // === 會話管理 ===
        function saveSession() {
            const sessionData = {
                sessionId: sessionId,
                // 修正：只儲存 Gemini 兼容的對話歷史
                chatHistory: chatHistory, 
                lastActivity: Date.now()
            };
            localStorage.setItem('hotelChatSession', JSON.stringify(sessionData));
            sessionIdDisplay.textContent = sessionId; // 確保 ID 更新
        }

        function updateActivity() {
            lastActivityTime = Date.now();
            saveSession();
        }

        function startSessionMonitor() {
            // 修正：Session Monitor 邏輯，避免無限重置
            setInterval(() => {
                if (Date.now() - lastActivityTime > SESSION_TIMEOUT && chatHistory.length > 0) {
                    createNewSession(true);
                }
            }, 60000); // 每分鐘檢查一次
        }
        
        async function checkBackendStatus() {
            try {
                // 修正：使用 API_BASE_URL/health 進行檢查
                const response = await fetch(`${API_BASE_URL}/health`); 
                if (response.ok) {
                    statusDisplay.textContent = '🟢 連線正常';
                    statusDisplay.style.color = 'white'; // 保持與 header 顏色一致
                } else {
                    statusDisplay.textContent = '🟠 後端錯誤或正在啟動...';
                    statusDisplay.style.color = '#ffc107';
                }
            } catch (error) {
                statusDisplay.textContent = '🔴 連線失敗，服務可能離線';
                statusDisplay.style.color = '#dc3545';
                console.error("Backend health check failed:", error);
            }
        }

        // === 訊息處理 ===
        /**
         * 向聊天視窗添加訊息並更新歷史紀錄
         * @param {string} content - 訊息內容 (可包含 HTML 如 <br>)
         * @param {string} role - 訊息角色 ('user' 或 'model')
         * @param {Date} timestamp - 訊息時間
         */
        function addMessage(content, role = 'model', timestamp = new Date()) {
            const isUser = role === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = content; 
            
            // 添加時間戳
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = timestamp.toLocaleTimeString('zh-TW', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            bubbleDiv.appendChild(timeDiv);
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            
            // 修正：只將用戶和 AI 的實際對話計入 chatHistory
            // 並且使用純文本格式，替換 <br> 為 \n
            if (role === 'user' || role === 'model') {
                const pureText = content
                    .replace(/<br\s*\/?>/gi, '\n')
                    .replace(/<\/?\w+[^>]*>/g, '') // 清理所有其他 HTML 標籤
                    .trim();

                // 檢查是否為系統卡片或歡迎訊息，不計入歷史
                if (pureText.length > 0 && !content.includes('welcome-message')) { 
                    chatHistory.push({
                        role: role,
                        text: pureText
                    });
                }
            }
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
            updateActivity();
        }
        
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing';
            typingDiv.innerHTML = '<div class="message-bubble"><span class="typing-dots">AI思考中</span></div>';
            typingDiv.id = 'typingIndicator';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // === 重置功能 (移到全域，以便 HTML 呼叫) ===
        // 修正：將這些函數提升到全域（不再是 const，以確保 onclick 能正確找到）
        window.showResetConfirm = function() {
            resetConfirm.classList.add('show');
            overlay.classList.add('show');
        }

        window.confirmReset = function() {
            // 修正：調用 createNewSession()
            createNewSession(); 
            cancelReset();
            
            // 顯示重置成功的系統提示
            addMessage(`🔄 已清除歷史記錄，開始新的對話！請問需要什麼協助？`, 'system-info');
        }

        window.cancelReset = function() {
            resetConfirm.classList.remove('show');
            overlay.classList.remove('show');
        }

        function showSessionTimeoutWarning() {
            // 修正：當會話重置時，不要再重複調用 createNewSession()
            addMessage(`
                <div style="text-align: center; color: #764ba2;">
                    ⏰ <strong>會話超時：</strong> 由於長時間未活動，已清除歷史記錄。
                    <br>請發送訊息以開始新的對話。
                </div>
            `, 'system-info'); 
        }

        // === 歡迎訊息 ===
        function showWelcomeMessage() {
            chatMessages.innerHTML = '';
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'welcome-message';
            welcomeDiv.innerHTML = `
                <h2>🏨 歡迎使用台北ＸＸ酒店智能訂房助理！</h2>
                <p>我是 Luna，我可以為您提供專業的訂房服務與旅遊諮詢</p>
                <div style="margin-top: 15px; font-size: 14px; opacity: 0.9;">
                    💡 <strong>提示：</strong> 點擊下方按鈕或直接輸入您的需求，例如「查詢房價」
                </div>
            `;
            // 這裡不使用 addMessage，避免將歡迎訊息計入 chatHistory
            chatMessages.appendChild(welcomeDiv); 
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function restoreChatHistory() {
            chatMessages.innerHTML = '';
            if (chatHistory.length === 0) {
                showWelcomeMessage();
            } else {
                // 從儲存的歷史記錄中恢復顯示，並將 \n 轉回 <br>
                chatHistory.forEach(msg => {
                    // 注意：這裡假設歷史記錄中的 text 已經是純文本
                    addMessage(msg.text.replace(/\n/g, '<br>'), msg.role, new Date(Date.now()));
                });
            }
        }

        // === 實用函數 ===
        const airportTransferFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfre2hV96gCFwawR-7B9eZbDk9wpU_JKxdcFHlw18fd72MXqw/viewform?usp=header';

        // 這些函數保持不變，因為它們是前端的輔助邏輯
        function handleAirportTransfer() {
            sendMessageFromQuickReply('我需要預約機場接送服務');
        }

        function handleOtherService(service) {
            sendMessageFromQuickReply(`我需要${service}`);
        }
        
        function sendMessageFromQuickReply(message) {
              messageInput.value = message;
              sendMessage();
        }

        // === 事件監聽 ===
        function setupEventListeners() {
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            // 快速回覆按鈕
            document.querySelectorAll('.quick-reply-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const service = this.getAttribute('data-service');
                    if (service === '接送機服務') {
                        handleAirportTransfer();
                    } else {
                        handleOtherService(service);
                    }
                });
            });

            messageInput.focus();
        }

        // === 訊息發送 (核心修正點) ===
        async function sendMessage() {
            const prompt = messageInput.value.trim();
            if (!prompt) return;

            // 智能會話重置檢測
            if (shouldResetSession(prompt)) {
                confirmReset();
                return;
            }

            addMessage(prompt, 'user');
            messageInput.value = '';
            sendButton.disabled = true;
            showTyping();
            statusDisplay.textContent = '🟡 正在向AI發送請求...';
            statusDisplay.style.color = '#ffc107';

            try {
                // 修正點：chatHistory 應該包含所有歷史對話，而不是排除最後一條
                // 因為 addMessage 已經將當前用戶訊息加入 chatHistory 了
                const response = await fetch(API_CHAT_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        // 傳送完整的 chatHistory 給後端
                        history: chatHistory 
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    let errorDetails = { message: `HTTP error! status: ${response.status}` };
                    try {
                        errorDetails = JSON.parse(errorText);
                    } catch (e) {
                        // 如果不是 JSON，使用原始文本
                        errorDetails.message += `. Details: ${errorText.substring(0, 100)}...`; 
                    }
                    throw new Error(errorDetails.message || `HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.text) {
                    const replyContent = data.text.replace(/\n/g, '<br>'); 
                    addMessage(replyContent, 'model'); // 將 AI 回覆加入歷史紀錄
                    statusDisplay.textContent = '🟢 連線正常';
                    statusDisplay.style.color = 'white';
                } else {
                    throw new Error(data.error || 'AI未返回有效回應，請檢查後端日誌。');
                }

            } catch (error) {
                console.error('Error:', error);
                
                // 顯示錯誤訊息
                addMessage(`
                    <div class="error-message">
                        ❌ 服務連線失敗，請檢查後端是否已正確部署或 API Key 是否有效。
                        <br>錯誤細節：${error.message.substring(0, 150)}
                    </div>
                `, 'model');
                
                statusDisplay.textContent = '🔴 連線錯誤';
                statusDisplay.style.color = '#dc3545';
                
                // 由於發送失敗，需要從歷史記錄中刪除剛才失敗的用戶訊息
                chatHistory.pop();
                saveSession();
            } finally {
                hideTyping();
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function shouldResetSession(message) {
            const resetKeywords = [
                '新對話', '重新開始', '重置', 'hello', '你好', '嗨', 
                '開始', '我要訂房', '查詢房價', '重新問', '不對', '換一個'
            ];
            return resetKeywords.some(keyword => 
                message.toLowerCase().includes(keyword.toLowerCase())
            );
        }

        window.exportChat = function() {
            const chatText = chatHistory.map(msg => 
                `${msg.role === 'user' ? '👤 客戶' : '🤖 助理'}: ${msg.text}`
            ).join('\n\n');
            
            const blob = new Blob([chatText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `飯店客服對話_${new Date().toLocaleDateString('zh-TW')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 初始化
        initializeChat();
    </script>
</body>
</html>
