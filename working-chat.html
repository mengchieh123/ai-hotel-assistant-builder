<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯店AI訂房助理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container { 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 90vh;
            position: relative;
        }
        .header { 
            background: linear-gradient(135deg, #2c3e50, #34495e); 
            color: white; 
            padding: 20px; 
            text-align: center; 
            position: relative;
        }
        .header-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-1px);
        }
        .chat-messages { 
            flex: 1;
            overflow-y: auto; 
            padding: 20px; 
            background: #f8f9fa; 
            display: flex;
            flex-direction: column;
        }
        .message { 
            margin-bottom: 15px; 
            display: flex; 
            align-items: flex-start; 
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message { 
            justify-content: flex-end; 
        }
        .bot-message { 
            justify-content: flex-start; 
        }
        .message-bubble { 
            max-width: 70%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            line-height: 1.4; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .user-message .message-bubble { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
        }
        .bot-message .message-bubble { 
            background: white; 
            color: #333; 
            border: 1px solid #e0e0e0; 
        }
        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
            transition: all 0.3s;
        }
        .quick-reply-btn {
            padding: 10px 15px;
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .quick-reply-btn:hover {
            background: #e8f0fe;
            border-color: #1a73e8;
            transform: translateY(-1px);
        }
        .input-area { 
            padding: 20px; 
            background: white; 
            border-top: 1px solid #e0e0e0; 
            display: flex; 
            gap: 10px; 
        }
        .message-input { 
            flex: 1; 
            padding: 12px 16px; 
            border: 2px solid #e0e0e0; 
            border-radius: 25px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.3s;
        }
        .message-input:focus {
            border-color: #007bff;
        }
        .send-button { 
            padding: 12px 24px; 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            transition: transform 0.2s;
        }
        .send-button:hover {
            transform: translateY(-2px);
        }
        .send-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        .typing { 
            padding: 10px; 
            color: #666; 
            font-style: italic; 
        }
        .typing-dots {
            display: inline-block;
        }
        .typing-dots::after {
            content: '...';
            animation: typing 1.5s infinite;
        }
        @keyframes typing {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        .session-info { 
            font-size: 12px; 
            opacity: 0.7; 
            margin-top: 5px; 
        }
        .service-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #007bff;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .service-card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .service-card p {
            margin-bottom: 15px;
            color: #555;
        }
        .service-card button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .service-card button:hover {
            background: #0056b3;
            transform: translateY(-1px);
        }
        .room-types {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .room-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
            transition: all 0.3s;
            cursor: pointer;
        }
        .room-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .room-card h4 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .room-features {
            list-style: none;
            margin: 10px 0;
        }
        .room-features li {
            padding: 5px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .room-price {
            font-weight: bold;
            color: #007bff;
            font-size: 18px;
            margin: 10px 0;
        }
        .welcome-message {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
            margin: 10px 0;
        }
        .reset-confirm {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 1000;
            text-align: center;
            display: none;
        }
        .reset-confirm.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            display: none;
        }
        .overlay.show {
            display: block;
        }
    </style>
</head>
<body>
    <!-- 重置確認對話框 -->
    <div class="overlay" id="overlay"></div>
    <div class="reset-confirm" id="resetConfirm">
        <h3>🔄 開始新對話</h3>
        <p>確定要清除當前對話記錄並開始新的對話嗎？</p>
        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
            <button class="control-btn" style="background: #dc3545;" onclick="confirmReset()">確定重置</button>
            <button class="control-btn" style="background: #6c757d;" onclick="cancelReset()">取消</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="header">
            <div class="header-controls">
                <button class="control-btn" onclick="showResetConfirm()">🔄 新對話</button>
                <button class="control-btn" onclick="exportChat()">💾 匯出記錄</button>
            </div>
            <h1>🏨 台北ＸＸ酒店 AI訂房助理</h1>
            <div id="status">🟢 連線正常</div>
            <div class="session-info">會話ID: <span id="sessionId"></span></div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <!-- 歡迎訊息將由 JavaScript 動態生成 -->
        </div>
        
        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" data-service="訂房服務">🏨 訂房服務</button>
            <button class="quick-reply-btn" data-service="接送機服務">🚗 接送機服務</button>
            <button class="quick-reply-btn" data-service="價格查詢">💰 價格查詢</button>
            <button class="quick-reply-btn" data-service="景點推薦">🎯 景點推薦</button>
            <button class="quick-reply-btn" data-service="餐廳推薦">🍽️ 餐廳推薦</button>
        </div>
        
        <div class="input-area">
            <input type="text" class="message-input" id="messageInput" placeholder="輸入您的訊息..." autocomplete="off">
            <button class="send-button" id="sendButton">傳送</button>
        </div>
    </div>

    <script>
        // === 核心變數定義 ===
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sessionIdDisplay = document.getElementById('sessionId');
        const quickReplies = document.getElementById('quickReplies');
        const resetConfirm = document.getElementById('resetConfirm');
        const overlay = document.getElementById('overlay');

        // 智能 Session 管理
        let sessionId = generateSessionId();
        let chatHistory = [];
        let lastActivityTime = Date.now();
        const SESSION_TIMEOUT = 30 * 60 * 1000; // 30分鐘超時

        // === 初始化函數 ===
        function initializeChat() {
            // 恢復或創建會話
            const savedSession = localStorage.getItem('hotelChatSession');
            if (savedSession) {
                const sessionData = JSON.parse(savedSession);
                // 檢查會話是否過期
                if (Date.now() - sessionData.lastActivity < SESSION_TIMEOUT) {
                    sessionId = sessionData.sessionId;
                    chatHistory = sessionData.chatHistory || [];
                    restoreChatHistory();
                } else {
                    createNewSession();
                }
            } else {
                createNewSession();
            }
            
            sessionIdDisplay.textContent = sessionId;
            setupEventListeners();
            startSessionMonitor();
        }

        function createNewSession() {
            sessionId = generateSessionId();
            chatHistory = [];
            showWelcomeMessage();
            saveSession();
        }

        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // === 會話管理 ===
        function saveSession() {
            const sessionData = {
                sessionId: sessionId,
                chatHistory: chatHistory,
                lastActivity: Date.now()
            };
            localStorage.setItem('hotelChatSession', JSON.stringify(sessionData));
        }

        function updateActivity() {
            lastActivityTime = Date.now();
            saveSession();
        }

        function startSessionMonitor() {
            setInterval(() => {
                if (Date.now() - lastActivityTime > SESSION_TIMEOUT) {
                    showSessionTimeoutWarning();
                }
            }, 60000); // 每分鐘檢查一次
        }

        // === 訊息處理 ===
        function addMessage(content, isUser = false, timestamp = new Date()) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = content;
            
            // 添加時間戳
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = timestamp.toLocaleTimeString('zh-TW', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
            
            bubbleDiv.appendChild(timeDiv);
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            
            // 保存到歷史記錄
            chatHistory.push({
                content: content,
                isUser: isUser,
                timestamp: timestamp.getTime()
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
            updateActivity();
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing';
            typingDiv.innerHTML = '<div class="message-bubble"><span class="typing-dots">AI思考中</span></div>';
            typingDiv.id = 'typingIndicator';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // === 重置功能 ===
        function showResetConfirm() {
            resetConfirm.classList.add('show');
            overlay.classList.add('show');
        }

        function confirmReset() {
            createNewSession();
            cancelReset();
            addMessage('🔄 已開始新對話！請問需要什麼協助？');
        }

        function cancelReset() {
            resetConfirm.classList.remove('show');
            overlay.classList.remove('show');
        }

        function showSessionTimeoutWarning() {
            if (chatHistory.length > 0) {
                addMessage('⏰ 由於長時間未活動，會話即將重置。如需繼續對話，請發送訊息。');
            }
        }

        // === 歡迎訊息 ===
        function showWelcomeMessage() {
            chatMessages.innerHTML = '';
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'welcome-message';
            welcomeDiv.innerHTML = `
                <h2>🏨 歡迎使用台北ＸＸ酒店智能訂房助理！</h2>
                <p>我可以為您提供專業的訂房服務與旅遊諮詢</p>
                <div style="margin-top: 15px; font-size: 14px; opacity: 0.9;">
                    💡 <strong>提示：</strong> 點擊上方「新對話」可隨時重新開始
                </div>
            `;
            chatMessages.appendChild(welcomeDiv);
        }

        function restoreChatHistory() {
            chatMessages.innerHTML = '';
            if (chatHistory.length === 0) {
                showWelcomeMessage();
            } else {
                chatHistory.forEach(msg => {
                    addMessage(msg.content, msg.isUser, new Date(msg.timestamp));
                });
            }
        }

        // === 其他現有功能（保持不變）===
        // [這裡保留您原有的 roomTypes, handleAirportTransfer, handleOtherService 等函數]
        // 由於字數限制，我保持這些函數不變，只專注於 Session 管理優化

        const airportTransferFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfre2hV96gCFwawR-7B9eZbDk9wpU_JKxdcFHlw18fd72MXqw/viewform?usp=header';

        const roomTypes = [
            {
                name: "標準雙人房",
                price: "NT$ 2,800/晚",
                features: ["雙人床", "免費WiFi", "平面電視", "迷你冰箱", "獨立衛浴"],
                description: "適合商務旅客或情侶出遊"
            },
            {
                name: "豪華家庭房",
                price: "NT$ 4,200/晚",
                features: ["兩張雙人床", "免費WiFi", "平面電視", "迷你冰箱", "獨立衛浴", "小客廳"],
                description: "適合家庭旅遊，可容納2-4人"
            }
            // ... 其他房型
        ];

        function showRoomTypes() {
            const roomTypesHTML = `
                <div class="room-types">
                    ${roomTypes.map(room => `
                        <div class="room-card" onclick="selectRoomType('${room.name}')">
                            <h4>${room.name}</h4>
                            <div class="room-price">${room.price}</div>
                            <p>${room.description}</p>
                            <ul class="room-features">
                                ${room.features.map(feature => `<li>✓ ${feature}</li>`).join('')}
                            </ul>
                        </div>
                    `).join('')}
                </div>
            `;
            
            addMessage(`
                🏨 <strong>我們提供以下房型：</strong><br><br>
                ${roomTypesHTML}
                <br>請點擊感興趣的房型，或告訴我您的具體需求？
            `);
        }

        function selectRoomType(roomName) {
            addMessage(`我對「${roomName}」感興趣`, true);
            // 後續處理...
        }

        function handleAirportTransfer() {
            addMessage('🚗 我需要預約機場接送服務', true);
            // ... 現有邏輯
        }

        function handleOtherService(service) {
            addMessage(`我需要${service}`, true);
            // ... 現有邏輯
        }

        // === 事件監聽 ===
        function setupEventListeners() {
            sendButton.addEventListener('click', sendMessage);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });
            
            // 快速回覆按鈕
            document.querySelectorAll('.quick-reply-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const service = this.getAttribute('data-service');
                    if (service === '接送機服務') {
                        handleAirportTransfer();
                    } else {
                        handleOtherService(service);
                    }
                });
            });

            messageInput.focus();
        }

        // === 訊息發送 ===
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            // 智能會話重置檢測
            if (shouldResetSession(message)) {
                confirmReset();
                return;
            }

            addMessage(message, true);
            messageInput.value = '';
            sendButton.disabled = true;
            showTyping();

            try {
                // 您的現有 API 調用邏輯
                const API_URL = 'https://ai-hotel-assistant-builder-production.up.railway.app/chat';
                const proxy = 'https://corsproxy.io/?';
                const url = proxy + encodeURIComponent(API_URL);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, sessionId: sessionId })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                
                if (data.success) {
                    addMessage(data.reply.replace(/\n/g, '<br>'));
                } else {
                    throw new Error(data.error || 'Unknown error');
                }

            } catch (error) {
                console.error('Error:', error);
                addMessage('❌ 發送失敗，請重試。錯誤: ' + error.message);
            } finally {
                hideTyping();
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function shouldResetSession(message) {
            const resetKeywords = [
                '新對話', '重新開始', '重置', 'hello', '你好', '嗨', 
                '開始', '我要訂房', '查詢房價', '重新問', '不對', '換一個'
            ];
            return resetKeywords.some(keyword => 
                message.toLowerCase().includes(keyword.toLowerCase())
            );
        }

        function exportChat() {
            const chatText = chatHistory.map(msg => 
                `${msg.isUser ? '使用者' : '助理'}: ${msg.content}`
            ).join('\n\n');
            
            const blob = new Blob([chatText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `飯店客服對話_${new Date().toLocaleDateString('zh-TW')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 初始化
        initializeChat();
    </script>
</body>
</html>
