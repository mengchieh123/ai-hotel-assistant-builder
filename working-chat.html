<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 獲取 DOM 元素 (使用您的新 ID)
        const chatWindow = document.getElementById('chat-window'); // 聊天視窗
        const userInput = document.getElementById('input-message'); // 輸入框
        const sendBtn = document.getElementById('send-button'); // 發送按鈕 (ID 已修改)
        
        const API_ENDPOINT = '/chat'; 

        // 會話 ID 管理
        let sessionId = localStorage.getItem('sessionId') || `sess_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
        localStorage.setItem('sessionId', sessionId);

        // 首次載入時，發送一個空指令來觸發後端的初始回覆
        // 確保您在 server.js 中設定了初始 Rich Card 訊息
        sendMessage('', false);

        /**
         * 渲染訊息到聊天視窗
         */
        function appendMessage(sender, text, richCardData = null) {
            const messageContainer = document.createElement('div');
            // 匹配您新的 CSS 類別
            messageContainer.classList.add('message', sender === 'user' ? 'user' : 'assistant'); 

            // 訊息文本 (Rich Card 處理將添加到這裡)
            let innerHTML = text.replace(/\n/g, '<br>');

            // 渲染 Rich Card / 按鈕 (僅限 assistant 訊息)
            if (sender !== 'user' && richCardData && richCardData.type === 'button_list') {
                let cardHTML = '<div class="rich-card" style="margin-top:10px; padding-top:10px; border-top: 1px solid #c0c0c0;">';
                if (richCardData.title) {
                    cardHTML += `<p style="font-weight:600; margin-bottom: 8px;">${richCardData.title}</p>`;
                }
                cardHTML += '<div class="button-group" style="display:flex; flex-direction:column; gap:8px;">';
                
                richCardData.buttons.forEach(button => {
                    // 使用內聯樣式來確保按鈕可見且可點擊
                    cardHTML += `<button class="rich-card-btn" data-value="${button.value}" style="padding: 10px 12px; border: none; border-radius: 5px; background-color: #5a85ff; color: white; cursor: pointer; font-size: 14px; text-align: center;">${button.text}</button>`;
                });
                
                cardHTML += '</div></div>';
                
                innerHTML += cardHTML;
            }
            
            messageContainer.innerHTML = innerHTML;
            chatWindow.appendChild(messageContainer);
            
            // 滾動到最新訊息
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * 處理用戶輸入和 API 請求
         */
        async function sendMessage(customMessage = null, isUserAction = true) {
            const message = customMessage || userInput.value.trim();
            
            if (!message && isUserAction) {
                return;
            }

            if (!customMessage) {
                userInput.value = '';
            }

            if (message && isUserAction) {
                appendMessage('user', message);
            }

            // 禁用輸入，等待回應
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sessionId, message })
                });

                const data = await response.json();

                if (response.ok) {
                    appendMessage('assistant', data.reply, data.richCard); 
                    sessionId = data.sessionId; 
                } else {
                    const errorMessage = data.error || data.reply || `[HTTP 錯誤 ${response.status}] 服務器發生錯誤。`;
                    appendMessage('assistant', `發生錯誤: ${errorMessage}。請稍後再試。`);
                }

            } catch (error) {
                console.error('API Request Failed:', error);
                appendMessage('assistant', `抱歉，伺服器連接失敗，請檢查網路或聯繫管理員。`);
            } finally {
                // 重新啟用輸入
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
        
        // --- 事件監聽器：使用新的 ID ---

        // 點擊發送按鈕
        sendBtn.addEventListener('click', () => sendMessage());

        // 按下 Enter 鍵
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
                event.preventDefault(); 
            }
        });

        // 處理 Rich Card 按鈕點擊 (事件委派)
        chatWindow.addEventListener('click', (e) => {
            if (e.target.classList.contains('rich-card-btn')) {
                const buttonValue = e.target.getAttribute('data-value');
                if (buttonValue) {
                    // 禁用當前訊息泡泡中的所有按鈕
                    const buttons = e.target.closest('.message').querySelectorAll('.rich-card-btn');
                    buttons.forEach(btn => btn.disabled = true);
                    
                    // 將按鈕的值視為用戶輸入發送
                    sendMessage(buttonValue, true);
                }
            }
        });
    });
</script>
