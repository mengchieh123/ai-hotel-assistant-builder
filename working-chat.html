<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飯店AI訂房助理</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft JhengHei', Arial, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container { 
            width: 100%;
            max-width: 800px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .header { 
            background: linear-gradient(135deg, #2c3e50, #34495e); 
            color: white; 
            padding: 20px; 
            text-align: center; 
        }
        .chat-messages { 
            flex: 1;
            overflow-y: auto; 
            padding: 20px; 
            background: #f8f9fa; 
            display: flex;
            flex-direction: column;
        }
        .message { 
            margin-bottom: 15px; 
            display: flex; 
            align-items: flex-start; 
        }
        .user-message { 
            justify-content: flex-end; 
        }
        .bot-message { 
            justify-content: flex-start; 
        }
        .message-bubble { 
            max-width: 70%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            line-height: 1.4; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .user-message .message-bubble { 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
        }
        .bot-message .message-bubble { 
            background: white; 
            color: #333; 
            border: 1px solid #e0e0e0; 
        }
        .quick-replies {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        .quick-reply-btn {
            padding: 10px 15px;
            background: #f1f3f4;
            border: 1px solid #dadce0;
            border-radius: 18px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .quick-reply-btn:hover {
            background: #e8f0fe;
            border-color: #1a73e8;
        }
        .input-area { 
            padding: 20px; 
            background: white; 
            border-top: 1px solid #e0e0e0; 
            display: flex; 
            gap: 10px; 
        }
        .message-input { 
            flex: 1; 
            padding: 12px 16px; 
            border: 2px solid #e0e0e0; 
            border-radius: 25px; 
            font-size: 16px; 
            outline: none;
            transition: border-color 0.3s;
        }
        .message-input:focus {
            border-color: #007bff;
        }
        .send-button { 
            padding: 12px 24px; 
            background: linear-gradient(135deg, #007bff, #0056b3); 
            color: white; 
            border: none; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: bold;
            transition: transform 0.2s;
        }
        .send-button:hover {
            transform: translateY(-2px);
        }
        .send-button:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }
        .typing { 
            padding: 10px; 
            color: #666; 
            font-style: italic; 
        }
        .session-info { 
            font-size: 12px; 
            opacity: 0.7; 
            margin-top: 5px; 
        }
        .service-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #007bff;
        }
        .service-card h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .service-card p {
            margin-bottom: 15px;
            color: #555;
        }
        .service-card button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .service-card button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <h1>🏨 飯店AI訂房助理</h1>
            <div id="status">🟢 連線正常</div>
            <div class="session-info">會話ID: <span id="sessionId"></span></div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-bubble">
                    🤖 <strong>歡迎使用飯店智能訂房助理！</strong><br><br>
                    我可以為您提供：<br>
                    🏨 訂房服務<br>
                    🚗 <strong>接送機服務</strong><br>
                    💰 價格查詢<br>
                    🎯 景點推薦<br>
                    🍽️ 餐廳推薦<br><br>
                    請告訴我您需要什麼協助？
                </div>
            </div>
        </div>
        
        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" data-service="訂房服務">🏨 訂房服務</button>
            <button class="quick-reply-btn" data-service="接送機服務">🚗 接送機服務</button>
            <button class="quick-reply-btn" data-service="價格查詢">💰 價格查詢</button>
            <button class="quick-reply-btn" data-service="景點推薦">🎯 景點推薦</button>
            <button class="quick-reply-btn" data-service="餐廳推薦">🍽️ 餐廳推薦</button>
        </div>
        
        <div class="input-area">
            <input type="text" class="message-input" id="messageInput" placeholder="輸入您的訊息...">
            <button class="send-button" id="sendButton">傳送</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sessionIdDisplay = document.getElementById('sessionId');
        const quickReplies = document.getElementById('quickReplies');
        
        // 生成或恢復 sessionId - 保持對話上下文
        let sessionId = localStorage.getItem('hotelSessionId');
        if (!sessionId) {
            sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('hotelSessionId', sessionId);
        }
        sessionIdDisplay.textContent = sessionId;

        // 接送機服務表單連結
        const airportTransferFormUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfre2hV96gCFwawR-7B9eZbDk9wpU_JKxdcFHlw18fd72MXqw/viewform?usp=header';

        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'message-bubble';
            bubbleDiv.innerHTML = message;
            
            messageDiv.appendChild(bubbleDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message typing';
            typingDiv.innerHTML = '<div class="message-bubble">輸入中...</div>';
            typingDiv.id = 'typingIndicator';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // 處理接送機服務
        function handleAirportTransfer() {
            addMessage('🚗 我需要預約機場接送服務', true);
            
            showTyping();
            
            setTimeout(() => {
                hideTyping();
                
                // 創建接送機服務卡片
                const serviceCard = document.createElement('div');
                serviceCard.className = 'service-card';
                serviceCard.innerHTML = `
                    <h3>🚗 尊榮禮賓車服務</h3>
                    <p>我們很榮幸為您提供便捷的機場接送服務，讓您的旅程從一開始就輕鬆無憂。</p>
                    <p>請點擊以下按鈕，前往我們的接送服務預訂系統：</p>
                    <button id="bookTransferBtn">立即預訂機場接送</button>
                `;
                
                chatMessages.appendChild(serviceCard);
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                // 添加按鈕事件
                document.getElementById('bookTransferBtn').addEventListener('click', function() {
                    window.open(airportTransferFormUrl, '_blank');
                    addMessage('✅ 已為您開啟機場接送服務預訂表單，請在新開啟的頁面填寫需求。');
                });
            }, 1000);
        }

        // 處理其他服務
        function handleOtherService(service) {
            addMessage(`我需要${service}`, true);
            
            showTyping();
            
            setTimeout(() => {
                hideTyping();
                
                let reply = '';
                switch(service) {
                    case '訂房服務':
                        reply = '🏨 好的，我來協助您預訂房間。請問您需要什麼房型？入住和退房日期是什麼時候？';
                        break;
                    case '價格查詢':
                        reply = '💰 我可以為您查詢房價。請告訴我您想查詢的日期和房型？';
                        break;
                    case '景點推薦':
                        reply = '🎯 我很樂意為您推薦周邊景點。請問您對什麼類型的景點感興趣？（例如：自然風景、歷史古蹟、購物中心等）';
                        break;
                    case '餐廳推薦':
                        reply = '🍽️ 我可以為您推薦餐廳。請問您偏好什麼類型的料理？（例如：中式、西式、日式、素食等）';
                        break;
                    default:
                        reply = `關於${service}，請提供更多詳細資訊，我們將為您服務。`;
                }
                
                addMessage(reply);
            }, 1000);
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;

            addMessage(message, true);
            messageInput.value = '';
            sendButton.disabled = true;
            showTyping();

            try {
                // 檢查是否為接送機服務相關訊息
                if (message.includes('接送') || message.includes('機場') || message.includes('接機') || message.includes('送機')) {
                    setTimeout(() => {
                        hideTyping();
                        handleAirportTransfer();
                        sendButton.disabled = false;
                        messageInput.focus();
                    }, 1000);
                    return;
                }

                const API_URL = 'https://ai-hotel-assistant-builder-production.up.railway.app/chat';
                const proxy = 'https://corsproxy.io/?';
                const url = proxy + encodeURIComponent(API_URL);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: sessionId
                    })
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                
                if (data.success) {
                    addMessage(data.reply.replace(/\n/g, '<br>'));
                } else {
                    throw new Error(data.error || 'Unknown error');
                }

            } catch (error) {
                console.error('Error:', error);
                addMessage('❌ 發送失敗，請重試。錯誤: ' + error.message);
            } finally {
                hideTyping();
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        // 快速回覆按鈕事件
        document.querySelectorAll('.quick-reply-btn').forEach(button => {
            button.addEventListener('click', function() {
                const service = this.getAttribute('data-service');
                
                if (service === '接送機服務') {
                    handleAirportTransfer();
                } else {
                    handleOtherService(service);
                }
            });
        });

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        messageInput.focus();
    </script>
</body>
</html>
