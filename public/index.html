<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 訂房助理</title>
<style>
  /* Reset & Base */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background-color: #f9f9f9;
    color: #444;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  /* 容器 */
  .chat-wrapper {
    width: 380px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgb(100 100 111 / 0.1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 頭部 */
  .header {
    background: #eef1f6;
    padding: 24px 20px;
    text-align: center;
    border-bottom: 1px solid #d8dbe5;
  }
  .header h1 {
    font-weight: 600;
    font-size: 22px;
    color: #2c3e50;
  }
  .header p {
    margin-top: 6px;
    font-size: 13px;
    color: #7f8c8d;
  }

  /* 人像區 */
  .avatar-area {
    display: flex;
    justify-content: center;
    margin: 20px 0 10px 0;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #dbe6f4; /* 淡雅淺藍背景 */
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-shadow: 0 4px 12px rgb(100 100 111 / 0.15);
  }
  .avatar img {
    width: 90%;
    height: auto;
    object-fit: cover;
    border-radius: 50%;
  }

  /* 聊天視窗 */
  .chat-window {
    flex: 1;
    background: #fefefe;
    padding: 15px 20px;
    overflow-y: auto;
    border-top: 1px solid #e6e9ed;
    border-bottom: 1px solid #e6e9ed;
  }

  .message {
    max-width: 75%;
    padding: 12px 18px;
    border-radius: 18px;
    margin-bottom: 14px;
    font-size: 14px;
    line-height: 1.4;
    box-shadow: 0 1px 4px rgb(0 0 0 / 0.05);
  }

  .message.assistant {
    background-color: #f0f4ff; /* 淡淡藍色 */
    color: #34495e;
    border-bottom-left-radius: 4px;
  }
  .message.user {
    background-color: #dbe6f4; /* 淡雅藍灰 */
    color: #2c3e50;
    border-bottom-right-radius: 4px;
    margin-left: auto;
  }

  /* 輸入區 */
  .input-area {
    padding: 15px 20px;
    background: #eef1f6;
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .input-area input[type="text"] {
    flex: 1;
    padding: 14px 18px;
    border: 1.5px solid #cbd3e1;
    border-radius: 25px;
    font-size: 14px;
    color: #2c3e50;
    background: #fff;
    transition: border-color 0.3s;
  }
  .input-area input[type="text"]:focus {
    border-color: #7ea6ff;
    outline: none;
  }
  .input-area button {
    background-color: #7ea6ff;
    border: none;
    color: white;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 26px;
    border-radius: 25px;
    cursor: pointer;
    transition: background-color 0.3s;
  }
  .input-area button:hover {
    background-color: #5a85ff;
  }

  /* 滿足星級飯店風格的細節簡潔 */
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-thumb {
    background: #a8b1cc;
    border-radius: 3px;
  }
  ::-webkit-scrollbar-track {
    background: #f0f3f9;
  }
</style>
</head>
<body>
  <div class="chat-wrapper" role="main" aria-label="訂房助理聊天介面">
    <header class="header">
      <h1>AI 訂房助理</h1>
      <p>專業且安心的訂房體驗</p>
    </header>

    <section class="avatar-area" aria-label="助理人像">
      <div class="avatar">
        <img src="https://i.imgur.com/4AiXzf8.png" alt="訂房助理人像" />
      </div>
    </section>

    <section class="chat-window" id="chat-window" aria-live="polite" aria-relevant="additions">
      <div class="message assistant">
        歡迎！請問需要什麼協助嗎？
      </div>
    </section>

    <form class="input-area" onsubmit="event.preventDefault(); sendMessage();">
      <input type="text" id="input-message" placeholder="輸入您的問題..." aria-label="輸入問題" autocomplete="off" />
      <button type="submit" aria-label="發送訊息">發送</button>
    </form>
  </div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const inputMsg = document.getElementById('input-message');

  function sendMessage() {
    const message = inputMsg.value.trim();
    if (!message) return;
    // 建立使用者訊息
    const userMsg = document.createElement('div');
    userMsg.classList.add('message', 'user');
    userMsg.textContent = message;
    chatWindow.appendChild(userMsg);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    inputMsg.value = '';

    // 模擬助理回應（可替換成 API 呼叫）
    setTimeout(() => {
      const assistantMsg = document.createElement('div');
      assistantMsg.classList.add('message', 'assistant');
      assistantMsg.textContent = '謝謝您的訊息，我們將盡快回覆您。';
      chatWindow.appendChild(assistantMsg);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }, 800);
  }
</script>
</body>
</html>
