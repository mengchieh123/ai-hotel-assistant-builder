<!DOCTYPE html>
<html lang="zh-TW">
<head>
</head>
<body>
  <div class="chat-wrapper" role="main" aria-label="訂房助理聊天介面">
    <header class="header">
      <h1>AI 訂房助理</h1>
      <p>專業且安心的訂房體驗</p>
    </header>

    <section class="avatar-area" aria-label="助理人像">
      <div class="avatar">
        <img src="https://i.imgur.com/4AiXzf8.png" alt="訂房助理人像" />
      </div>
    </section>

    <section class="chat-window" id="chat-window" aria-live="polite" aria-relevant="additions">
          </section>

    <div class="input-area">
      <input type="text" id="input-message" placeholder="輸入您的問題..." aria-label="輸入問題" autocomplete="off" />
      <button type="button" id="send-button" aria-label="發送訊息">發送</button>
    </div>
  </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 獲取 DOM 元素
        const chatWindow = document.getElementById('chat-window'); 
        const userInput = document.getElementById('input-message'); 
        const sendBtn = document.getElementById('send-button'); 
        
        const API_ENDPOINT = '/chat'; 

        // 會話 ID 管理
        let sessionId = localStorage.getItem('sessionId') || `sess_${Date.now()}_${Math.random().toString(36).substring(2, 9)}`;
        localStorage.setItem('sessionId', sessionId);

        // 首次載入時，發送一個空指令來觸發後端的初始回覆
        sendMessage('', false);

        /**
         * 渲染訊息到聊天視窗
         */
        function appendMessage(sender, text, richCardData = null) {
            // ... (此處省略渲染邏輯，請確保其與之前的版本一致)
            const messageContainer = document.createElement('div');
            // ... (設置 class, innerHTML, 滾動邏輯)
            
            // Rich Card/Button 點擊事件委派 (重要)
            if (sender !== 'user' && richCardData && richCardData.type === 'button_list') {
                 let cardHTML = '<div class="rich-card">';
                 if (richCardData.title) {
                     cardHTML += `<p style="font-weight:600; margin-bottom: 8px;">${richCardData.title}</p>`;
                 }
                 cardHTML += '<div class="button-group" style="display:flex; flex-direction:column; gap:8px;">';
                 
                 richCardData.buttons.forEach(button => {
                     cardHTML += `<button class="rich-card-btn" type="button" data-value="${button.value}">${button.text}</button>`;
                 });
                 
                 cardHTML += '</div></div>';
                 
                 // 將按鈕添加到訊息文本中
                 let tempDiv = document.createElement('div');
                 tempDiv.innerHTML = text.replace(/\n/g, '<br>');
                 tempDiv.innerHTML += cardHTML;
                 messageContainer.innerHTML = tempDiv.innerHTML;
            } else {
                 messageContainer.innerHTML = text.replace(/\n/g, '<br>');
            }
            
            messageContainer.classList.add('message', sender === 'user' ? 'user' : 'assistant'); 
            chatWindow.appendChild(messageContainer);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * 處理用戶輸入和 API 請求
         */
        async function sendMessage(customMessage = null, isUserAction = true) {
            const message = customMessage || userInput.value.trim();
            
            if (!message && isUserAction) {
                return;
            }

            if (!customMessage) {
                userInput.value = '';
            }

            if (message && isUserAction) {
                appendMessage('user', message);
            }

            // 禁用輸入，等待回應
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            const currentSessionId = sessionId || 'initial_session_id'; // 確保 sessionId 有值

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }, // 確保 Content-Type 正確
                    body: JSON.stringify({ sessionId: currentSessionId, message })
                });

                const data = await response.json();

                if (response.ok) {
                    appendMessage('assistant', data.reply, data.richCard); 
                    // 在成功回應後才更新 sessionId
                    sessionId = data.sessionId; 
                } else {
                    const errorMessage = data.error || data.reply || `[HTTP 錯誤 ${response.status}] 服務器發生錯誤。`;
                    appendMessage('assistant', `發生錯誤: ${errorMessage}。請稍後再試。`);
                }

            } catch (error) {
                console.error('API Request Failed:', error);
                appendMessage('assistant', `抱歉，伺服器連接失敗，請檢查網路或聯繫管理員。`);
            } finally {
                // 重新啟用輸入
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }
        
        // --- 事件監聽器：修正後的事件處理 ---

        // 點擊發送按鈕
        sendBtn.addEventListener('click', () => sendMessage());

        // 按下 Enter 鍵
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
                event.preventDefault(); 
            }
        });

        // 處理 Rich Card 按鈕點擊 (事件委派)
        chatWindow.addEventListener('click', (e) => {
            if (e.target.classList.contains('rich-card-btn')) {
                const buttonValue = e.target.getAttribute('data-value');
                if (buttonValue) {
                    // 禁用當前訊息泡泡中的所有按鈕
                    const buttons = e.target.closest('.message').querySelectorAll('.rich-card-btn');
                    buttons.forEach(btn => btn.disabled = true);
                    
                    // 將按鈕的值視為用戶輸入發送
                    sendMessage(buttonValue, true);
                }
            }
        });
    });
</script>
</body>
</html>
